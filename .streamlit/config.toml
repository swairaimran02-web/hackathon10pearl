# Streamlit theme for the Utility Bill Decoder dashboard.
# Frontend-only; these colors are also used by dashboard/styles.py.

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true